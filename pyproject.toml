[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lg-dkgp"
version = "0.1.0"
description = "Continuity-aware action priors for frozen world-model planning"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.12.0", "torchvision==0.27.0", "gpytorch==1.15.2",
  "numpy>=1.26,<3", "scipy==1.15.3", "h5py==3.16.0", "hdf5plugin==6.0.0",
  "Pillow>=11.3", "einops==0.8.2", "hydra-core>=1.3,<1.4",
  "omegaconf>=2.3,<2.4", "PyYAML>=6", "scikit-learn==1.7.2",
  "lightning==2.6.5", "stable-pretraining==0.1.7", "stable-worldmodel[train]",
  "datasets==5.0.0", "huggingface-hub>=1", "opencv-python-headless==4.10.0.84"
]

[project.optional-dependencies]
pc = ["pygame==2.6.1", "pymunk==7.3.1", "shapely==2.1.2", "ogbench==1.2.2"]
libero = ["mujoco==2.3.7", "robosuite==1.4.0", "bddl==1.0.1", "gym==0.25.2",
          "easydict==1.10", "future>=0.18", "numba==0.61.2", "termcolor", "PyOpenGL"]
robotwin = ["numpy==1.26.4", "sapien==3.0.0b1", "mplib==0.2.1", "trimesh==4.4.3",
            "open3d==0.18.0", "imageio==2.34.2", "transforms3d==0.4.2", "toppra==0.6.9"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
lgdkgp = "lgdkgp.cli:main"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
  [{extra = "pc"}, {extra = "libero"}],
  [{extra = "pc"}, {extra = "robotwin"}],
  [{extra = "libero"}, {extra = "robotwin"}],
]

[tool.uv.sources]
stable-worldmodel = {git = "https://github.com/galilai-group/stable-worldmodel.git", rev = "15a5538d492ae524c64cb18cc56a2d70611e877e"}

[tool.setuptools]
license-files = ["LICENSE", "third_party/licenses/*", "third_party/robotwin/LICENSE"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lgdkgp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
